name: Engineering checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: engineering-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and checks on macOS
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop,vision,dev]"
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { $parseErrors += $errors }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Bootstrap Windows project environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts')
      - name: Validate Windows capture provider frame API
        if: runner.os == 'Windows'
        run: python -c "from windows_capture import Frame; assert hasattr(Frame, 'convert_to_bgr'), 'windows-capture Frame lacks convert_to_bgr required by the adapter'"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Run test suite
        run: python -m pytest
      - name: Run synthetic ten-camera capacity smoke
        run: python scripts/qa_ten_camera_smoke.py --root artifacts/qa-ten-camera
      - name: Build wheel and source distribution
        run: python -m build
