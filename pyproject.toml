[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-monitor"
version = "0.1.0"
description = "Local screen-based factory camera event review with explicit coverage gaps"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.10,<5", "httpx>=0.27,<1", "psutil>=6,<8"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
vision = ["ultralytics>=8.3,<9", "lap>=0.5,<1", "scipy>=1.13,<2"]
windows = ["windows-capture>=1.5,<3; sys_platform == 'win32'", "mss>=10,<11; sys_platform == 'win32'", "pyautogui>=0.9.54; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
factory-monitor = "factory_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factory_monitor = ["capture/assets/*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
